name: fleet-security-test
on:
  push:
    paths:
      - 'research/fleet-security-cset-2026/**'
  pull_request:
    paths:
      - 'research/fleet-security-cset-2026/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/fleet-security-cset-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: PYTHONPATH=src python scripts/selftest.py
