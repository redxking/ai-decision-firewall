[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-decision-firewall-poc"
version = "0.2.0a4"
description = "Synthetic proof of concept for evidence-grounded privileged-identity containment decisions."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "jsonschema>=4.23,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
