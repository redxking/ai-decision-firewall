[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-decision-firewall-poc"
version = "0.4.0a2"
description = "Simulation-only AI decision firewall for evidence-grounded, policy-controlled operational actions."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.5", "jsonschema>=4.23,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
