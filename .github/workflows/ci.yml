name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - name: Validate locked dependencies and runtime SBOM
        run: python scripts/validate_supply_chain.py
      - name: Run unit tests
        run: PYTHONWARNINGS=error PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Run Phase 3 simulation-only SOC demonstrations
        run: |
          phase3_demo_root="$(mktemp -d)"
          PYTHONPATH=src python run_phase3.py --output-dir "$phase3_demo_root/demo"
      - name: Run Phase 3 deterministic adversarial corpus
        run: |
          phase3_corpus_root="$(mktemp -d)"
          PYTHONPATH=src python run_phase3_corpus.py --output-dir "$phase3_corpus_root/corpus"
      - name: Validate Phase 2 starter inputs
        run: python run_phase2.py --validate-only
      - name: Run Phase 2 starter read-only replay
        run: python run_phase2.py
      - name: Verify Phase 2.1 qualification fixture generation
        run: python scripts/generate_phase2_qualification_fixture.py --check
      - name: Validate Phase 2.1 qualification inputs
        run: python run_phase2.py --config config/phase2_qualification.json --validate-only
      - name: Run Phase 2.1 qualification replay
        run: python run_phase2.py --config config/phase2_qualification.json
      - name: Validate commit-frozen Gate B campaign plan
        run: python scripts/generate_gate_b_ce2_campaign.py --validate-plan
      - name: Validate commit-frozen feature-assurance campaign plan
        run: python scripts/generate_feature_assurance_ce2_campaign.py --validate-plan
      - name: Validate planned source-to-decision campaign
        run: python scripts/generate_source_to_decision_ce2_campaign.py --validate-plan
      - name: Validate committed Phase 2 claim evidence
        run: python -m scripts.validate_claim_evidence
      - name: Validate committed Phase 2.1 qualification evidence
        run: >-
          python -m scripts.validate_claim_evidence
          --record contracts/v0.2.0/examples/phase2-qualification-evidence-record.json
          --profile P2-CE-002
      - name: Validate committed Phase 2.3 Gate B campaign evidence
        run: >-
          python -m scripts.validate_claim_evidence
          --record contracts/v0.2.0/examples/phase2-gate-b-ce2-evidence-record.json
          --profile P2-CE-003
      - name: Validate committed Phase 2.4 feature-assurance campaign evidence
        run: >-
          python -m scripts.validate_claim_evidence
          --record contracts/v0.2.0/examples/phase2-feature-assurance-ce2-evidence-record.json
          --profile P2-CE-004
      - name: Verify repository manifest
        run: python scripts/validate_manifest.py

  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ADF_IMAGE_TAG: adf-stage-a:${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository manifest before build
        run: python3 scripts/validate_manifest.py
      - name: Build the digest-pinned Stage A image without publishing
        run: >-
          docker build --pull
          --build-arg ADF_IMAGE_CREATED=1970-01-01T00:00:00Z
          --build-arg ADF_IMAGE_REVISION=${GITHUB_SHA}
          --build-arg ADF_IMAGE_VERSION=0.4.0a2
          --tag "${ADF_IMAGE_TAG}" .
      - name: Verify immutable image configuration
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "${ADF_IMAGE_TAG}")" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "${ADF_IMAGE_TAG}")" = '["python","/opt/adf/run_service.py"]'
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${ADF_IMAGE_TAG}")" = "${GITHUB_SHA}"
      - name: Smoke-run the image with production restrictions
        run: >-
          docker run --rm
          --network=none
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          --user 10001:10001
          "${ADF_IMAGE_TAG}" --help
      - name: Validate packaged policy and schema
        run: >-
          docker run --rm
          --network=none
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m
          --user 10001:10001
          --entrypoint python
          "${ADF_IMAGE_TAG}"
          -c "from adf_poc.phase3.config import Phase3PolicyConfig; Phase3PolicyConfig.load('/opt/adf/config/phase3_policy.json')"
      - name: Run bounded storage-fault campaigns in the image
        run: >-
          docker run --rm
          --network=none
          --read-only
          --cap-drop=ALL
          --security-opt=no-new-privileges
          --pids-limit=64
          --memory=512m
          --cpus=2
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m
          --tmpfs /audit-volume:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
          --user 10001:10001
          --volume "${GITHUB_WORKSPACE}/tests:/opt/adf/tests:ro"
          --env PYTHONPATH=/opt/adf/src:/opt/adf/dependencies:/opt/adf
          --env ADF_CONTAINER_STORAGE_CAMPAIGN=1
          --entrypoint python
          "${ADF_IMAGE_TAG}"
          -m unittest
          tests.test_stage_a_sigkill_campaign
          tests.test_stage_a_storage_failure_campaign
          tests.container_stage_a_storage_fault
          -q
      - name: Run external container-kill campaign
        run: >-
          ADF_CONTAINER_EXTERNAL_KILL_CAMPAIGN=1
          PYTHONWARNINGS=error
          PYTHONDONTWRITEBYTECODE=1
          PYTHONPATH=src:.
          python3 -m unittest
          tests.test_stage_a_container_external_kill
          -q
