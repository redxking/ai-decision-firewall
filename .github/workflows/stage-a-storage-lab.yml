name: Stage A storage fault lab

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      authorization:
        description: Enter I_ACKNOWLEDGE_PRIVILEGED_EPHEMERAL_LAB
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage-a-storage-lab
  cancel-in-progress: false

jobs:
  dm-flakey-error-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADF_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ADF_LAB_AUTHORIZATION: ${{ inputs.authorization }}
      ADF_IMAGE_TAG: adf-stage-a-storage-lab-candidate:${{ inputs.candidate_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Bind the explicit authorization and candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${ADF_LAB_AUTHORIZATION}" = "I_ACKNOWLEDGE_PRIVILEGED_EPHEMERAL_LAB"
          [[ "${ADF_CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${ADF_CANDIDATE_SHA}"
      - name: Install exact test dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - name: Verify candidate and ordinary regression suite
        run: |
          python scripts/validate_manifest.py
          PYTHONWARNINGS=error PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Record ephemeral host capability
        shell: bash
        run: |
          set -euo pipefail
          ADF_EVIDENCE_DIR="$(mktemp -d "${RUNNER_TEMP}/adf-stage-a-storage-evidence.XXXXXX")"
          printf 'ADF_EVIDENCE_DIR=%s\n' "${ADF_EVIDENCE_DIR}" >> "${GITHUB_ENV}"
          {
            printf 'candidate_sha=%s\n' "${ADF_CANDIDATE_SHA}"
            printf 'run_id=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            uname -a
            docker version
          } > "${ADF_EVIDENCE_DIR}/host.txt"
          if sudo modprobe dm_flakey > "${ADF_EVIDENCE_DIR}/modprobe.txt" 2>&1; then
            printf 'module_load=success\n' >> "${ADF_EVIDENCE_DIR}/modprobe.txt"
          else
            printf 'module_load=unavailable_or_builtin\n' >> "${ADF_EVIDENCE_DIR}/modprobe.txt"
          fi
          sudo dmsetup targets | tee "${ADF_EVIDENCE_DIR}/dmsetup-targets.txt"
          grep -Eq '^flakey[[:space:]]' "${ADF_EVIDENCE_DIR}/dmsetup-targets.txt"
      - name: Build the exact unpublished candidate image
        run: >-
          docker build --pull
          --build-arg ADF_IMAGE_CREATED=1970-01-01T00:00:00Z
          --build-arg ADF_IMAGE_REVISION=${ADF_CANDIDATE_SHA}
          --build-arg ADF_IMAGE_VERSION=0.4.0a2
          --tag "${ADF_IMAGE_TAG}" .
      - name: Run dm-flakey error-writes campaign
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format '{{.Id}}' "${ADF_IMAGE_TAG}" | tee "${ADF_EVIDENCE_DIR}/candidate-image-id.txt"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/run_stage_a_block_device_campaign.py \
            --image "${ADF_IMAGE_TAG}" \
            --fault-mode dm-flakey-error-writes \
            --allow-privileged-lab 2>&1 | tee "${ADF_EVIDENCE_DIR}/dm-flakey-error-writes.log"
      - name: Preserve bounded lab evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-a-storage-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adf-stage-a-storage-evidence.*
          if-no-files-found: error
          retention-days: 30
