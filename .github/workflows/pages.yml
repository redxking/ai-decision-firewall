name: Publish evidence-gated website

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'

      - name: Validate locked dependencies and runtime SBOM
        run: python scripts/validate_supply_chain.py

      - name: Run the complete project test suite
        run: PYTHONWARNINGS=error PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:. python -m unittest discover -s tests -v

      - name: Run Phase 3 simulation-only SOC demonstrations
        run: |
          phase3_demo_root="$(mktemp -d)"
          PYTHONPATH=src python run_phase3.py --output-dir "$phase3_demo_root/demo"

      - name: Run Phase 3 deterministic adversarial corpus
        run: |
          phase3_corpus_root="$(mktemp -d)"
          PYTHONPATH=src python run_phase3_corpus.py --output-dir "$phase3_corpus_root/corpus"

      - name: Validate Phase 2 starter inputs
        run: python run_phase2.py --validate-only

      - name: Run Phase 2 starter read-only replay
        run: python run_phase2.py

      - name: Verify Phase 2.1 qualification fixture generation
        run: python scripts/generate_phase2_qualification_fixture.py --check

      - name: Validate Phase 2.1 qualification inputs
        run: python run_phase2.py --config config/phase2_qualification.json --validate-only

      - name: Run Phase 2.1 qualification replay
        run: python run_phase2.py --config config/phase2_qualification.json

      - name: Validate commit-frozen Gate B campaign plan
        run: python scripts/generate_gate_b_ce2_campaign.py --validate-plan

      - name: Validate commit-frozen feature-assurance campaign plan
        run: python scripts/generate_feature_assurance_ce2_campaign.py --validate-plan

      - name: Validate planned source-to-decision campaign
        run: python scripts/generate_source_to_decision_ce2_campaign.py --validate-plan

      - name: Validate committed claim evidence
        run: |
          python -m scripts.validate_claim_evidence
          python -m scripts.validate_claim_evidence --record contracts/v0.2.0/examples/phase2-qualification-evidence-record.json --profile P2-CE-002
          python -m scripts.validate_claim_evidence --record contracts/v0.2.0/examples/phase2-gate-b-ce2-evidence-record.json --profile P2-CE-003
          python -m scripts.validate_claim_evidence --record contracts/v0.2.0/examples/phase2-feature-assurance-ce2-evidence-record.json --profile P2-CE-004

      - name: Verify the sanitized website bundle
        run: python scripts/build_public_site_data.py --check

      - name: Verify the release manifest
        run: python scripts/validate_manifest.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload validated static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: validate-and-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete validated artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
